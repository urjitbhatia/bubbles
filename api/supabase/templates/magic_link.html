<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bubbles login link</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #1a1a1a;">Sign in to Bubbles</h2>
  <p>Click the button below to sign in to your Bubbles account. This link will expire in 1 hour.</p>
  <p>
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 500;">
      Sign In to Bubbles
    </a>
  </p>
  <p style="color: #666; font-size: 14px; margin-top: 20px;">
    If you didn't request this login link, you can safely ignore this email.
  </p>
  <p style="color: #999; font-size: 12px; margin-top: 30px;">
    Bubbles - Share items with your trusted circles
  </p>
</body>
</html>
