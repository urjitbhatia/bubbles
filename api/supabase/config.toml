# Supabase Local Development Configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ['./seed/*.sql']

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:6174"
additional_redirect_urls = [
  "http://127.0.0.1:6174",
  "http://localhost:6174"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # Disable for local dev

[auth.email.template.invite]
subject = "You've been invited"
content_path = "./templates/invite.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

# OAuth providers (configure with your credentials)
[auth.external.google]
enabled = false
client_id = ""
# Set secret via: supabase secrets set SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=...
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.external.github]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"

[analytics]
enabled = false

[edge_runtime]
enabled = true
