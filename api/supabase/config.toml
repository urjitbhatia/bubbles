# Supabase Local Development Configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 64321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 64322
shadow_port = 64320
major_version = 15

[db.pooler]
enabled = false
port = 64329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ['./seed/*.sql']

[studio]
enabled = true
port = 64323

[inbucket]
enabled = true
port = 64324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:6174"
additional_redirect_urls = [
  "http://127.0.0.1:6174",
  "http://localhost:6174",
  "http://localhost:6174/auth/callback"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # Disable for local dev - auto-confirms emails

[auth.email.template.invite]
subject = "You've been invited to Bubbles"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your Bubbles login link"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

# OAuth providers
# Google OAuth (primary auth method for Bubbles)
# To enable:
# 1. Create OAuth credentials at https://console.cloud.google.com/apis/credentials
# 2. Set client_id below
# 3. Run: supabase secrets set SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=your_client_secret
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "http://localhost:64321/auth/v1/callback"

# GitHub OAuth (disabled - not in MVP scope)
[auth.external.github]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"

[analytics]
enabled = false

[edge_runtime]
enabled = true
