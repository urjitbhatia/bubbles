[package]
name = "supaflare-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers
worker = "0.4"
worker-macros = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OpenAPI documentation
utoipa = { version = "4", features = ["chrono", "uuid"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"

# Async runtime compatibility
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# JWT handling
jsonwebtoken = "9"
base64 = "0.22"

# Console error logging
console_error_panic_hook = "0.1"

[profile.release]
# Optimize for small binary size
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-mutable-globals"]
