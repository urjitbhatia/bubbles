# Cloudflare Pages configuration
name = "supaflare-web"
compatibility_date = "2025-11-02"

# Build output directory (Vite default)
[build]
command = "pnpm run build"

# Service binding to backend Worker
[[services]]
binding = "API"
service = "supaflare-api"

# For local development with wrangler pages dev
[dev]
port = 5174
